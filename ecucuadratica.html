<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12 - Ecuación Cuadrática</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
        input { padding: 8px; margin: 5px 0 15px 0; width: 100px; }
        button { padding: 8px 15px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        pre { background: #eee; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ecuación Cuadrática</h2>
        <p>Ingrese los valores para <b>ax² + bx + c = 0</b>:</p>
        <label>a: <input type="number" id="valA" value="3"></label><br>
        <label>b: <input type="number" id="valB" value="6"></label><br>
        <label>c: <input type="number" id="valC" value="3"></label><br>
        <button onclick="resolverCuadratica()">Calcular Raíces</button>
        <h3>Resultado:</h3>
        <pre id="resultadoCuadratica">Esperando datos...</pre>
    </div>

    <script>
        function resolverCuadratica() {
            let a = parseFloat(document.getElementById('valA').value);
            let b = parseFloat(document.getElementById('valB').value);
            let c = parseFloat(document.getElementById('valC').value);

            let D = (b ** 2) - (4 * a * c);
            let textoResultado = "";

            if (D > 0) {
                let x1 = (-b + Math.sqrt(D)) / (2 * a);
                let x2 = (-b - Math.sqrt(D)) / (2 * a);
                textoResultado = "The equation has two roots,\n" +
                                 "x1 = " + x1.toFixed(4) + "\n" +
                                 "x2 = " + x2.toFixed(4);
            } else if (D === 0) {
                let x = -b / (2 * a);
                textoResultado = "The equation has one root,\n" +
                                 "x = " + x.toFixed(4);
            } else {
                textoResultado = "The equation has no real roots.";
            }

            document.getElementById('resultadoCuadratica').innerText = textoResultado;
        }
    </script>

</body>
</html>
