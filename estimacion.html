<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 13 - Estimación de Pi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        pre { background: #eee; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Estimación de Pi (&pi;)</h2>
        <p>Calcula la aproximación usando bucles para n = 100, 10000 y 1000000.</p>
        <button onclick="calcularPi()">Ejecutar Estimación</button>
        <h3>Resultado:</h3>
        <pre id="resultadoPi">Haz clic en ejecutar...</pre>
    </div>

    <script>
        function calcularPi() {
            let nValues = [100, 10000, 1000000];
            let textoResultado = "";

            for (let i = 0; i < nValues.length; i++) {
                let n = nValues[i];
                let suma = 0;

                for (let k = 1; k <= n; k++) {
                    suma += 1 / (k ** 2);
                }

                let piEst = Math.sqrt(6 * suma);
                textoResultado += "Para n = " + n + ", pi estimado = " + piEst.toFixed(15) + "\n";
            }

            textoResultado += "\nValor real de Math.PI = " + Math.PI.toFixed(15);

            document.getElementById('resultadoPi').innerText = textoResultado;
        }
    </script>

</body>
</html>
